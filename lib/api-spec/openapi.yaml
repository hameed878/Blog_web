openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for the Crush entrepreneur publication
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: posts
    description: Publicly published stories
  - name: admin
    description: Authenticated editorial operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /posts:
    get:
      operationId: listPublishedPosts
      tags: [posts]
      summary: List published posts
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: Published posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"
  /posts/featured:
    get:
      operationId: getFeaturedPost
      tags: [posts]
      summary: Get the featured post
      responses:
        "200":
          description: Featured post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: No featured post is published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /posts/{slug}:
    get:
      operationId: getPublishedPost
      tags: [posts]
      summary: Get a published post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get editorial dashboard summary
      responses:
        "200":
          description: Summary counts and recent posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          description: Admin sign-in required
  /admin/posts:
    get:
      operationId: listAdminPosts
      tags: [admin]
      summary: List all posts for the admin
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, draft, published]
            default: all
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Posts available to the admin
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"
        "401":
          description: Admin sign-in required
    post:
      operationId: createAdminPost
      tags: [admin]
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostInput"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "400":
          description: Invalid post
        "401":
          description: Admin sign-in required
  /admin/posts/{id}:
    get:
      operationId: getAdminPost
      tags: [admin]
      summary: Get a post for editing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "401":
          description: Admin sign-in required
        "404":
          description: Post not found
    patch:
      operationId: updateAdminPost
      tags: [admin]
      summary: Update a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostUpdate"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "400":
          description: Invalid post
        "401":
          description: Admin sign-in required
        "404":
          description: Post not found
    delete:
      operationId: deleteAdminPost
      tags: [admin]
      summary: Delete a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Post deleted
        "401":
          description: Admin sign-in required
        "404":
          description: Post not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    BlogPost:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        contentHtml:
          type: string
        coverImageUrl:
          type: [string, "null"]
        category:
          type: string
        author:
          type: string
        status:
          type: string
          enum: [draft, published]
        featured:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, "null"]
          format: date-time
      required:
        - id
        - title
        - slug
        - excerpt
        - contentHtml
        - coverImageUrl
        - category
        - author
        - status
        - featured
        - createdAt
        - updatedAt
        - publishedAt
    BlogPostInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        excerpt:
          type: string
          maxLength: 360
        contentHtml:
          type: string
          maxLength: 200000
        coverImageUrl:
          type: [string, "null"]
        category:
          type: string
          minLength: 1
          maxLength: 80
        author:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [draft, published]
        featured:
          type: boolean
      required:
        - title
        - excerpt
        - contentHtml
        - category
        - author
        - status
        - featured
    BlogPostUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        excerpt:
          type: string
          maxLength: 360
        contentHtml:
          type: string
          maxLength: 200000
        coverImageUrl:
          type: [string, "null"]
        category:
          type: string
          minLength: 1
          maxLength: 80
        author:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [draft, published]
        featured:
          type: boolean
    AdminSummary:
      type: object
      properties:
        totalPosts:
          type: integer
        publishedPosts:
          type: integer
        draftPosts:
          type: integer
        recentPosts:
          type: array
          items:
            $ref: "#/components/schemas/BlogPost"
      required: [totalPosts, publishedPosts, draftPosts, recentPosts]

